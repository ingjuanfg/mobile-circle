version: 2.1

jobs:
  setup-tools:
    docker:
      - image: cimg/android:2023.09
    environment:
      # Usamos el SDK preinstalado en la imagen, que se encuentra en /home/circleci/android-sdk
      ANDROID_SDK_ROOT: /home/circleci/android-sdk
    steps:
      - run:
          name: Clonar repo manualmente con HTTPS
          command: |
            git clone https://github.com/ingjuanfg/mobile-circle.git .

      - run:
          name: Instalar Node.js y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Validar herramientas instaladas
          command: |
            java -version
            node -v
            appium -v
            gradle -v
            adb version
            emulator -version || true

      - run:
          name: Instalar imagen del sistema Android 30
          command: |
            export JAVA_OPTS="-Djavax.xml.accessExternalSchema=all"
            echo "Instalando imagen de sistema: system-images;android-30;google_apis;x86"
            yes | /home/circleci/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/circleci/android-sdk --no_https "system-images;android-30;google_apis;x86" || true

      - run:
          name: Crear y arrancar emulador Android headless
          command: |
            echo "Creando AVD 'test-emulator'..."
            echo "no" | avdmanager create avd -n test-emulator -k "system-images;android-30;google_apis;x86" --device "pixel"
            echo "Arrancando el emulador en segundo plano en modo software..."
            emulator -avd test-emulator -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off &
            echo "Esperando a que el emulador arranque..."
            # Esperar más tiempo ya que el modo software puede ser más lento (ajusta el sleep si es necesario)
            sleep 20
            adb wait-for-device
            adb shell input keyevent 82
            sleep 10
            adb devices

workflows:
  version: 2
  setup-and-validate:
    jobs:
      - setup-tools
