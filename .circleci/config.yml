version: 2.1

jobs:
  setup-tools:
    docker:
      - image: cimg/android:2023.09  # ✅ Android SDK + Java + sudo + git
    resource_class: large

    environment:
      ANDROID_HOME: /opt/android/sdk
      ANDROID_SDK_ROOT: /opt/android/sdk
      PATH: /opt/android/sdk/platform-tools:/opt/android/sdk/emulator:/opt/android/sdk/cmdline-tools/latest/bin:/opt/android/sdk/tools:/opt/android/sdk/tools/bin:$PATH

    steps:
      - checkout

      - run:
          name: Instalar Node.js y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Validar herramientas instaladas
          command: |
            java -version
            node -v
            appium -v
            gradle -v
            sdkmanager --list || true
            adb version
            emulator -version || true

workflows:
  version: 2
  setup-and-validate:
    jobs:
      - setup-tools
