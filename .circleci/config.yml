version: 2.1

jobs:
  setup-tools:
    docker:
      - image: cimg/android:2023.09
    environment:
      # Usamos el SDK preinstalado en la imagen (ubicado en /home/circleci/android-sdk)
      ANDROID_SDK_ROOT: /home/circleci/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - run:
          name: Clonar repositorio vía HTTPS y cambiar a rama
          command: |
            git clone --branch circleci-project-setup https://github.com/ingjuanfg/mobile-circle.git .

      - run:
          name: Instalar Node.js y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Validar herramientas instaladas
          command: |
            java -version
            node -v
            appium -v
            gradle -v
            adb version
            emulator -version || true

      - run:
          name: Instalar imagen del sistema Android 30
          command: |
            export JAVA_OPTS="-Djavax.xml.accessExternalSchema=all"
            echo "Instalando imagen: system-images;android-30;google_apis;x86_64"
            yes | /home/circleci/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/circleci/android-sdk --no_https "system-images;android-30;google_apis;x86_64" || true

      - run:
          name: Arrancar emulador, iniciar Appium y ejecutar tests
          command: |
            # Crear AVD usando el system image x86_64
            echo "Creando AVD 'test-emulator'..."
            echo "no" | avdmanager create avd -n test-emulator -k "system-images;android-30;google_apis;x86_64" --device "pixel"
            
            # Arrancar el emulador en modo software
            echo "Arrancando emulador en modo software..."
            emulator -avd test-emulator -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off &
            EMULATOR_PID=$!
            echo "Esperando a que el emulador arranque..."
            sleep 40
            adb wait-for-device
            adb devices
            
            # Instalar el driver de UIAutomator2 y validar dependencias con Appium Doctor
            echo "Instalando el driver de UIAutomator2..."
            appium driver install uiautomator2
            echo "Instalando Appium Doctor..."
            sudo npm install -g appium-doctor
            appium-doctor --android
            
            # Arrancar Appium server (forzando a escuchar en 127.0.0.1 y permitiendo CORS)
            echo "Arrancando Appium server en segundo plano..."
            nohup appium --address 127.0.0.1 --allow-cors > appium.log 2>&1 &
            sleep 10
            echo "Appium server iniciado. Log (últimas líneas):"
            tail -n 20 appium.log
            
            # Ejecutar las pruebas con Gradle
            echo "Ejecutando tests con Gradle..."
            ./gradlew test --info --stacktrace
            
            echo "Finalizando el emulador..."
            kill $EMULATOR_PID

workflows:
  version: 2
  setup-and-test:
    jobs:
      - setup-tools
