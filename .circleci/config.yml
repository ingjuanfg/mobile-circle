version: 2.1

jobs:
  setup-tools:
    docker:
      - image: cimg/android:2023.09
    environment:
      # Usamos el SDK preinstalado en /home/circleci/android-sdk que ya viene configurado en la imagen.
      ANDROID_SDK_ROOT: /home/circleci/android-sdk
    steps:
      - run:
          name: Clonar repo manualmente con HTTPS
          command: |
            git clone https://github.com/ingjuanfg/mobile-circle.git .

      - run:
          name: Instalar Node.js y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Validar herramientas instaladas
          command: |
            java -version
            node -v
            appium -v
            gradle -v
            adb version
            emulator -version || true

      - run:
          name: Instalar imagen del sistema Android 30
          command: |
            # Instalar la imagen del sistema necesaria para crear el emulador.
            yes | /home/circleci/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/circleci/android-sdk "system-images;android-30;google_apis;x86"

      - run:
          name: Crear y arrancar emulador Android headless
          command: |
            # Crear el AVD con la imagen instalada.
            echo "no" | avdmanager create avd -n test-emulator -k "system-images;android-30;google_apis;x86" --device "pixel"
            # Arrancar el emulador en segundo plano
            emulator -avd test-emulator -no-window -no-audio -no-boot-anim -no-snapshot &
            echo "Esperando que el emulador arranque..."
            adb wait-for-device
            adb shell input keyevent 82
            sleep 10
            adb devices

workflows:
  version: 2
  setup-and-validate:
    jobs:
      - setup-tools
