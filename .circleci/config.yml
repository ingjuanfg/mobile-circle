version: 2.1

orbs:
  android: circleci/android@2.2.0

jobs:
  test:
    docker:
      - image: cimg/android:2023.09  # Imagen con Java, Android SDK, etc.
    resource_class: large  # Para tener más memoria al correr el emulador
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - checkout

      - run:
          name: Instalar Node y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Crear y lanzar emulador Android
          command: |
            echo "no" | avdmanager create avd -n circleci-avd -k "system-images;android-30;google_apis;x86"
            emulator -avd circleci-avd -no-audio -no-window -no-snapshot &

            # Esperar a que arranque el emulador completamente
            adb wait-for-device
            adb shell input keyevent 82

      - run:
          name: Lanzar Appium
          command: |
            appium --base-path /wd/hub --log-level error &
            sleep 10  # Esperar que Appium esté listo

      - run:
          name: Ejecutar pruebas
          command: ./gradlew test

workflows:
  version: 2
  test:
    jobs:
      - test
