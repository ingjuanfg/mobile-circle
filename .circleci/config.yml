version: 2.1

jobs:
  setup-tools:
    docker:
      - image: cimg/android:2023.09
    # La imagen cimg/android:2023.09 ya viene con el Android SDK preinstalado.
    # No es necesario reinstalar cmdline-tools ni platform-tools.
    environment:
      # En este ejemplo se utiliza el valor por defecto o el que ya está configurado en la imagen.
      # Algunos repositorios usan /home/circleci/android-sdk, que es donde se encuentra el SDK preinstalado.
      ANDROID_SDK_ROOT: /home/circleci/android-sdk
    steps:
      - run:
          name: Clonar repo manualmente con HTTPS
          command: |
            git clone https://github.com/ingjuanfg/mobile-circle.git .

      - run:
          name: Instalar Node.js y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Validar herramientas instaladas
          command: |
            java -version
            node -v
            appium -v
            gradle -v
            adb version
            emulator -version || true

workflows:
  version: 2
  setup-and-validate:
    jobs:
      - setup-tools
