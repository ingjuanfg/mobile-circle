version: 2.1

jobs:
  setup-tools:
    docker:
      - image: cimg/android:2023.09
    environment:
      ANDROID_SDK_ROOT: /home/circleci/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - run:
          name: Debug: Verificar entorno y rutas
          command: |
            echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
            echo "JAVA_HOME: $JAVA_HOME"
            echo "CLASSPATH: $CLASSPATH"
            echo "Estructura de $ANDROID_SDK_ROOT/cmdline-tools:"
            ls -R $ANDROID_SDK_ROOT/cmdline-tools || echo "No se encontró cmdline-tools"
            echo "Verificando existencia de sdkmanager:"
            if [ -f $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager ]; then
              echo "sdkmanager existe en $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "sdkmanager NO existe en la ruta esperada"
            fi

      - run:
          name: Clonar repo manualmente con HTTPS
          command: |
            git clone https://github.com/ingjuanfg/mobile-circle.git .

      - run:
          name: Instalar Node.js y Appium
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            sudo npm install -g appium

      - run:
          name: Validar herramientas instaladas
          command: |
            java -version
            node -v
            appium -v
            gradle -v
            adb version
            emulator -version || true

      - run:
          name: Instalar imagen del sistema Android 30
          command: |
            export JAVA_OPTS="-Djavax.xml.accessExternalSchema=all"
            echo "Instalando imagen de sistema: system-images;android-30;google_apis;x86 usando --no_https"
            yes | /home/circleci/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/circleci/android-sdk --no_https "system-images;android-30;google_apis;x86"

      - run:
          name: Crear y arrancar emulador Android headless
          command: |
            echo "Creando AVD 'test-emulator'..."
            echo "no" | avdmanager create avd -n test-emulator -k "system-images;android-30;google_apis;x86" --device "pixel"
            echo "Arrancando el emulador en segundo plano..."
            emulator -avd test-emulator -no-window -no-audio -no-boot-anim -no-snapshot &
            echo "Esperando que el emulador arranque..."
            adb wait-for-device
            adb shell input keyevent 82
            sleep 10
            adb devices

workflows:
  version: 2
  setup-and-validate:
    jobs:
      - setup-tools
